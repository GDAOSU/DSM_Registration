name: Windows VS2019 Toolset Build

on:
  push:
    branches:
      - c11_single
  pull_request:
    branches:
      - c11_single
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_ROOT: 'C:\vcpkg'
  VCPKG_DEFAULT_TRIPLET: 'x64-windows-v142'
  VCPKG_OVERLAY_TRIPLETS: '${{ github.workspace }}\.github\vcpkg-triplets'
  VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'

jobs:
  build:
    name: Windows 2022 with v142 toolset
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg-cache
            C:\vcpkg\downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('**/CMakeLists.txt', '.github/workflows/windows-build.yml', '.github/vcpkg-triplets/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          & "$env:VCPKG_ROOT\vcpkg.exe" install eigen3 gdal nanoflann --triplet "$env:VCPKG_DEFAULT_TRIPLET" --overlay-triplets="$env:VCPKG_OVERLAY_TRIPLETS" --clean-after-build

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -T v142 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET="$env:VCPKG_DEFAULT_TRIPLET" -DVCPKG_OVERLAY_TRIPLETS="$env:VCPKG_OVERLAY_TRIPLETS"

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-artifacts
          path: |
            build/**/Release/*.exe
            build/**/*.dll
          if-no-files-found: error
